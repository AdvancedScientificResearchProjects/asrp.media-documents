source_title:
  en: 'From the ''dark side of the force'' to the light of knowledge of the new era: interview with Denis Banchenko'
  ru: 'От “тёмной стороны силы” к свету знаний нового времени: интервью с Денисом Банченко'
source_description:
  en: 'In our interview, we delve into the depths of the influence of social networks on consciousness, explore why science still shies away from recognizing prehistoric high-tech civilizations and the expanded cognitive (extrasensory) abilities of humans.


    From shocking facts that official science prefers to block, to bold predictions about the future of humanity — the conversation with Denis Yurievich Banchenko reveals global challenges, hidden mechanisms of civilizational development, and new paths of integrating knowledge and technology aimed at changing the established order of things.


    Why do we risk repeating the mistakes of vanished civilizations? How do modern discoveries force us to reconsider medicine and human capabilities? And what is our place in the broader, interstellar economy of the future? The answers to these questions and much more can be found in this conversation, which will leave neither the seeker nor the skeptic indifferent.'
  ru: 'В нашем интервью мы погружаемся в глубины влияния социальных сетей на сознание, разбираемся с тем, почему наука до сих пор отходит от признания доисторических высокотехнологичных цивилизаций и расширенных когнитивных (экстрасенсорных) способностей человека.


    От шокирующих фактов, которые официальная наука предпочитает блокировать, до смелых прогнозов о будущем человечества — беседа с Денисом Юрьевичем Банченко раскрывает глобальные вызовы, скрытые механизмы цивилизационного развития и новые пути интеграции знаний и технологий, призванные изменить привычный порядок вещей.


    Почему мы рискуем повторить ошибку исчезнувших цивилизаций? Каким образом современные открытия заставляют пересмотреть медицину и человеческие возможности? И каково наше место в более широкой, межзвёздной экономике будущего? Ответы на эти вопросы и многое другое — в разговоре, который не оставит равнодушным ни искателя, ни скептика.'
