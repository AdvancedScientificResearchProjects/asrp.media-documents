source_title:
  en: Dubna against or together with Area S4 (EG & G and its successors), as one of the elements of the global project on UAP reverse engineering, predicted by Bob Lazar "Element - 115", later actually discovered and the search for its stable isotope at the superheavy elements factory
  ru: 'Дубна против или вместе с Area S4 (EG & G и её наследники), как один из элементов глобального проекта по реверс-инжинирингу UAP, предсказанный Бобом Лазаром "Элемент - 115", позже реально открытый и поиск его стабильного изотопа на фабрике сверхтяжёлых элементов '
source_description:
  en: 'In the context of the geopolitical tension of 2025, a high-ranking representative of the "Joint Institute for Nuclear Research" in Dubna reveals details of the synthesis of superheavy elements 114–118 (from Flerovium to Oganesson), achieved at the turn of the century. With the Superheavy Element Factory launched in 2020, scientists have moved from single atoms to dozens and hundreds: 65 atoms of Moscovium in 40 days, ~100 atoms of Flerovium. The isotopes'' lifespan is up to a second, and this is already enough to study nuclear and chemical properties. There is no practical application for the elements themselves yet... or is there? Spin-offs are already in play: radiation-resistant electronics for "Roscosmos", medical radioisotopes, track membranes for filters and bandages. Dubna leads the world, preparing to tackle elements 119–120 — Dubna is the center of global superheavy nuclear physics.'
  ru: 'В условиях геополитической напряжённости 2025 года высокопоставленный представитель "Объединённого института ядерных исследований" в Дубне раскрывает детали синтеза сверхтяжёлых элементов 114–118 (от Флеровия до Оганессона), достигнутого в на рубеже веков. С Фабрикой сверхтяжёлых элементов запущенной в 2020 - ном учёные перешли от единичных атомов к десяткам и сотням: 65 атомов Московия за 40 дней, ~100 атомов Флеровия. Жизнь изотопов — до секунды, и этого уже хватает для изучения ядерных и химических свойств. Практического применения самим элементам пока нет... или есть? Cпин-оффы уже в деле: радиационно-стойкая электроника для "Роскосмоса", медицинские радиоизотопы, трековые мембраны для фильтров и повязок. Дубна лидирует в мире, готовит штурм 119–120 элементов — Дубна центр глобальной физики сверхтяжёлых ядер.'
