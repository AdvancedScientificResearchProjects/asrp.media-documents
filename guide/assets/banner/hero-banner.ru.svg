<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Медиа-документы ASRP</title>
<desc id="d">Сгенерированная иллюстрация, не скриншот. Кольцо хаба с 9 узлами-темами, точки показывают число документов темы (10, 5, 4, 3, 2, 2, 1, 1, 1), заголовок и три числа, посчитанные по репозиторию: 29 документов в 9 темах, тексты на английском и русском, 36 записей о метаданных изображений без бинарных файлов.</desc>
