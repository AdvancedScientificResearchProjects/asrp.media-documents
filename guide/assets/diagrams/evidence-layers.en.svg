<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img" aria-labelledby="t d">
<title id="t">Three layers, never blended</title>
<desc id="d">Three columns. Left, shown by the repository: 29 document folders, 9 topics, 18 interviews, 9 articles, 2 research pieces, traceability metadata. Middle, said inside articles and attributed to their authors: patent, trademark, health and classified-archive statements, none backed by a document here. Right, not in the repository: the export files, image binaries, patent and trademark documents.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1180' height='440' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Three layers, never blended</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>What the repository shows, what articles say, what is not here</text>
<text x='1156' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>EVIDENCE</text>
<rect x='24' y='105' width='350' height='250' rx='12' fill='#0b1430' stroke='#34d399' stroke-width='1.6'/>
<text x='38' y='138.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='17' fill='#e6ecff' text-anchor='start' font-weight='700'>✓ Shown by the repository</text>
<text x='38' y='158.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>29 document folders in 9 topics</text>
<text x='38' y='178.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>18 interviews · 9 articles · 2 research pieces</text>
<text x='38' y='198.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>EN and RU bodies for every document</text>
<text x='38' y='218.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>source id and timestamps per document</text>
<text x='38' y='238.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>(metadata.yaml)</text>
<rect x='414' y='105' width='350' height='250' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='428' y='138.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='17' fill='#e6ecff' text-anchor='start' font-weight='700'>◇ Said inside articles</text>
<text x='428' y='158.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>a patent application was submitted; something</text>
<text x='428' y='178.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>was "patented"</text>
<text x='428' y='198.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>a trademark certificate is claimed</text>
<text x='428' y='218.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>health benefit of a method; classified archives</text>
<text x='428' y='238.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>each statement is the author's; no document</text>
<text x='428' y='258.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>backs it here</text>
<rect x='804' y='105' width='350' height='250' rx='12' fill='#0b1430' stroke='#ffa657' stroke-width='1.6'/>
<text x='818' y='138.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='17' fill='#e6ecff' text-anchor='start' font-weight='700'>✕ Not in the repository</text>
<text x='818' y='158.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>the 3 source export files</text>
<text x='818' y='178.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>image binaries (36 records, 0 files)</text>
<text x='818' y='198.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>patent and trademark documents or status</text>
<text x='818' y='218.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>any result, dataset or protocol</text>
<text x='24' y='402' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Articles are published media texts: they report views of their</text>
<text x='24' y='422' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>authors and are not verified scientific claims (README disclaimer).</text>
</svg>
