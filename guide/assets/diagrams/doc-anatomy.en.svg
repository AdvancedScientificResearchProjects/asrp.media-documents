<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-labelledby="t d">
<title id="t">One document folder</title>
<desc id="d">A folder documents/&lt;slug&gt;/ with five parts: README.md summary card, content.en.md English body, content.ru.md Russian body, index.md both languages in one page, metadata.yaml source traceability, and images/&lt;name&gt;/metadata.yaml image records. Counts: 29 cards, 29 English bodies, 29 Russian bodies, 29 index pages, 36 image records.</desc>
