<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img" aria-labelledby="t d">
<title id="t">Три слоя, которые не смешиваются</title>
<desc id="d">Три колонки. Слева показано репозиторием: 29 папок документов, 9 тем, 18 интервью, 9 статей, 2 исследовательских текстов, метаданные трассировки. В центре сказано внутри статей и приписано их авторам: заявления о патенте, товарном знаке, здоровье и засекреченном архиве, ни одно не подтверждено документом здесь. Справа чего нет в репозитории: файлов экспорта, изображений, документов о патентах и товарном знаке.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1180' height='440' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Три слоя, которые не смешиваются</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Что показывает репозиторий, что говорят статьи, чего здесь нет</text>
<text x='1156' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ДОКАЗАТЕЛЬСТВА</text>
<rect x='24' y='105' width='350' height='250' rx='12' fill='#0b1430' stroke='#34d399' stroke-width='1.6'/>
<text x='38' y='138.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='17' fill='#e6ecff' text-anchor='start' font-weight='700'>✓ Показано репозиторием</text>
<text x='38' y='158.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>29 папок документов в 9 темах</text>
<text x='38' y='178.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>18 интервью · 9 статей · 2 исследовательских</text>
<text x='38' y='198.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>текстов</text>
<text x='38' y='218.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>тексты EN и RU для каждого документа</text>
<text x='38' y='238.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>исходный id и даты на документ</text>
<text x='38' y='258.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>(metadata.yaml)</text>
<rect x='414' y='105' width='350' height='250' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='428' y='138.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='17' fill='#e6ecff' text-anchor='start' font-weight='700'>◇ Сказано внутри статей</text>
<text x='428' y='158.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>подана заявка на патент; что-то</text>
<text x='428' y='178.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>«запатентовано»</text>
<text x='428' y='198.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>заявлено свидетельство на товарный знак</text>
<text x='428' y='218.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>польза метода для здоровья; засекреченные</text>
<text x='428' y='238.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>архивы</text>
<text x='428' y='258.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>каждое утверждение принадлежит автору;</text>
<text x='428' y='278.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>документа в репозитории нет</text>
<rect x='804' y='105' width='350' height='250' rx='12' fill='#0b1430' stroke='#ffa657' stroke-width='1.6'/>
<text x='818' y='138.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='17' fill='#e6ecff' text-anchor='start' font-weight='700'>✕ Нет в репозитории</text>
<text x='818' y='158.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>3 файла экспорта источника</text>
<text x='818' y='178.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>бинарных изображений (36 записей, 0 файлов)</text>
<text x='818' y='198.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>документов и статуса по патентам и</text>
<text x='818' y='218.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>товарному знаку</text>
<text x='818' y='238.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>результатов, данных и протоколов</text>
<text x='24' y='382' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Статьи это опубликованные медиатексты: они передают позиции авторов</text>
<text x='24' y='402' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>и не являются проверенными научными утверждениями (отказ от</text>
<text x='24' y='422' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>ответственности в README).</text>
</svg>
