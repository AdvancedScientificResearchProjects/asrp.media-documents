<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" role="img" aria-labelledby="t d">
<title id="t">Как собран хаб</title>
<desc id="d">Четыре этапа слева направо. Этап 1: три файла экспорта из metadata.yaml, в репозитории не хранятся (перечислены в .gitignore). Этап 2: фильтр миграции, только тексты на английском и русском, для изображений только метаданные. Этап 3: 29 папок documents/&lt;slug&gt;/. Этап 4: 9 страниц тем и каталог документов, вход из README.md.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1180' height='400' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Как собран хаб</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>От экспортов платформы к страницам, которые вы читаете</text>
<text x='1156' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ПОТОК</text>
<rect x='24' y='110' width='260' height='190' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='38' y='141.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>1 · Экспорты источника</text>
<text x='38' y='161.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>3 JSON-файла из metadata.yaml</text>
<text x='38' y='181.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>документы, тексты, черновики</text>
<text x='38' y='201.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>(метка 202606241032)</text>
<text x='38' y='222.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffa657' text-anchor='start' font-weight='800'>✕ НЕТ В РЕПОЗИТОРИИ</text>
<rect x='324' y='110' width='260' height='190' rx='12' fill='#0b1430' stroke='#4ecdc4' stroke-width='1.6'/>
<text x='338' y='141.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>2 · Фильтр миграции</text>
<text x='338' y='161.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>только тексты EN и RU</text>
<text x='338' y='181.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>изображения: только</text>
<text x='338' y='201.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>метаданные, без бинарных</text>
<text x='338' y='221.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>файлов</text>
<text x='338' y='242.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#34d399' text-anchor='start' font-weight='800'>✓ ЕСТЬ В РЕПОЗИТОРИИ</text>
<rect x='624' y='110' width='260' height='190' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='638' y='141.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>3 · documents/&lt;slug&gt;/</text>
<text x='638' y='161.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>29 папок: карточка, тексты,</text>
<text x='638' y='181.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>index, метаданные, изображения</text>
<text x='638' y='201.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>трассировка к исходному id</text>
<text x='638' y='222.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#34d399' text-anchor='start' font-weight='800'>✓ ЕСТЬ В РЕПОЗИТОРИИ</text>
<rect x='924' y='110' width='260' height='190' rx='12' fill='#0b1430' stroke='#34d399' stroke-width='1.6'/>
<text x='938' y='141.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>4 · Темы и каталог</text>
<text x='938' y='161.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>9 страниц тем +</text>
<text x='938' y='181.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>documents/README.md</text>
<text x='938' y='201.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>вход из README.md</text>
<text x='938' y='222.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#34d399' text-anchor='start' font-weight='800'>✓ ЕСТЬ В РЕПОЗИТОРИИ</text>
<defs><marker id='m4ecdc4' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#4ecdc4'/></marker></defs>
<path d='M284.0,205.0 L324.0,205.0' fill='none' stroke='#4ecdc4' stroke-width='2' marker-end='url(#m4ecdc4)'></path>
<path d='M584.0,205.0 L624.0,205.0' fill='none' stroke='#4ecdc4' stroke-width='2' marker-end='url(#m4ecdc4)'></path>
<path d='M884.0,205.0 L924.0,205.0' fill='none' stroke='#4ecdc4' stroke-width='2' marker-end='url(#m4ecdc4)'></path>
<text x='24' y='362' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Экспорты названы в metadata.yaml (source_exports); в репозитории их</text>
<text x='24' y='382' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>нет, поэтому миграцию отсюда повторить нельзя.</text>
</svg>
