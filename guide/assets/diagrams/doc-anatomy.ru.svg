<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-labelledby="t d">
<title id="t">Одна папка документа</title>
<desc id="d">Папка documents/&lt;slug&gt;/ из пяти частей: README.md карточка, content.en.md английский текст, content.ru.md русский текст, index.md оба языка на одной странице, metadata.yaml трассировка источника, images/&lt;имя&gt;/metadata.yaml записи об изображениях. Количество: 29 карточек, 29 английских текстов, 29 русских текстов, 29 страниц index, 36 записей об изображениях.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1180' height='330' rx='18' fill='url(#bg)'/>

